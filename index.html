<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>555R - Open World Gangster</title><style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#000;overflow:hidden;font-family:Arial Black}canvas{display:block}#ui{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;color:#fff;text-shadow:2px 2px 0 #000;font-size:18px;z-index:9}#hud2{position:absolute;top:50px;left:12px;background:rgba(0,0,0,.8);padding:8px 12px;border-radius:8px;border-left:4px solid #f0f;color:#fff;z-index:9}#ctrl{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:9}.joy{width:120px;height:120px;background:radial-gradient(circle,rgba(255,0,255,.3),rgba(0,0,0,.4));border-radius:50%;border:2px solid #fff;position:relative}.st{width:52px;height:52px;background:#fff;border-radius:50%;position:absolute;left:34px;top:34px}.btn{width:70px;height:70px;background:linear-gradient(135deg,#f0f,#0ff);border:2px solid #fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px}#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);padding:16px;border-radius:12px;border:2px solid #f0f;color:#0ff;z-index:20;display:none;text-align:center}#logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;background:#111;padding:30px 40px;border-radius:20px;border:3px solid #f0f;text-align:center}h1{font-size:48px;background:linear-gradient(90deg,#f0f,#0ff,#ff0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}#startBtn{margin-top:18px;padding:12px 30px;background:linear-gradient(90deg,#f0f,#0ff);border:none;border-radius:30px;color:#fff;font-size:20px;font-weight:bold}</style></head><body><div id="logo"><h1>555R</h1><p style="color:#0ff">OPEN WORLD GANGSTER</p><p style="color:#aaa;font-size:12px">DISCO CITY 🪩</p><button id="startBtn" onclick="startGame()">▶️ PLAY NOW</button></div><div id="ui"><div>💵 $<span id="cash">1000</span> | <span id="star">0</span>⭐</div><div style="color:#f0f">🪩555R</div></div><div id="hud2"><div id="task">🎯 Find BLUE Car</div></div><div id="msg"></div><canvas id="c"></canvas><div id="ctrl"><div class="joy" id="joy"><div class="st" id="st"></div></div><div style="display:flex;gap:12px"><div class="btn" id="b1">🚪</div><div class="btn" id="b2">💃</div></div></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
let px=400,py=400,pa=0,inCar=false,carId=null,cash=1000,stars=0,keys={x:0,y:0},started=false;
const buildings=[];for(let i=0;i<20;i++)buildings.push({x:Math.random()*2000,y:Math.random()*2000,w:80+Math.random()*120,h:80+Math.random()*120});
let cars=[{x:700,y:500,c:'#00aaff',a:0,s:0,typ:'Sports'},{x:200,y:600,c:'#ffeb00',a:1,s:0,typ:'Taxi'},{x:900,y:300,c:'#ff00ff',a:2,s:0,typ:'SUV'},{x:500,y:800,c:'#fff',a:0,s:0,typ:'Police'},{x:300,y:200,c:'#f33',a:.5,s:0,typ:'Muscle'}];
let cops=[],coins=[];for(let i=0;i<15;i++)coins.push({x:Math.random()*1800,y:Math.random()*1800,taken:false});
let camX=0,camY=0,hue=0;
function startGame(){document.getElementById('logo').style.display='none';started=true;showMsg('Welcome to 555R DISCO CITY!');}
function showMsg(t){let m=document.getElementById('msg');m.innerHTML=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}
const joy=document.getElementById('joy'),st=document.getElementById('st');
joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect();let t=e.touches[0];let dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60);let d=Math.hypot(dx,dy);let max=45;if(d>max){dx=dx/d*max;dy=dy/d*max}st.style.left=34+dx+'px';st.style.top=34+dy+'px';keys.x=dx/max;keys.y=dy/max;e.preventDefault();},{passive:false});
joy.addEventListener('touchend',()=>{keys.x=0;keys.y=0;st.style.left='34px';st.style.top='34px';});
document.getElementById('b1').addEventListener('touchstart',()=>{if(!started)return;if(!inCar){for(let i=0;i<cars.length;i++){let c=cars[i];if(Math.hypot(px-c.x,py-c.y)<70){inCar=true;carId=i;showMsg('Entered '+c.typ);if(c.typ==='Sports'){cash+=500;document.getElementById('cash').innerText=cash;showMsg('MISSION DONE! +$500');document.getElementById('task').innerText='COLLECT $ & PARTY!';}break;}}}else{inCar=false;px=cars[carId].x+80;carId=null;showMsg('Exit Ride')}});
document.getElementById('b2').addEventListener('touchstart',()=>{if(!started)return;if(inCar){cars[carId].s+=3;stars=Math.min(5,stars+1);showMsg('NITRO!');}else{cash+=50;document.getElementById('cash').innerText=cash;showMsg('DISCO DANCE +$50')}document.getElementById('star').innerText='⭐'.repeat(Math.floor(stars))||'0';if(stars>=2&&cops.length<4)cops.push({x:px+350,y:py+350});});
function update(){if(!started)return;hue=(hue+1)%360;if(inCar&&carId!==null){let c=cars[carId];c.a+=keys.x*0.06;c.s+=keys.y*0.22;c.s*=0.985;c.x+=Math.cos(c.a)*c.s;c.y+=Math.sin(c.a)*c.s;px=c.x;py=c.y;pa=c.a;}else{px+=keys.x*4.2;py+=keys.y*4.2;if(keys.x||keys.y)pa=Math.atan2(keys.y,keys.x);}coins.forEach(o=>{if(!o.taken&&Math.hypot(px-o.x,py-o.y)<30){o.taken=true;cash+=150;document.getElementById('cash').innerText=cash;showMsg('+$150');}});cops.forEach(cp=>{let ang=Math.atan2(py-cp.y,px-cp.x);cp.x+=Math.cos(ang)*2.8;cp.y+=Math.sin(ang)*2.8;if(Math.hypot(px-cp.x,py-cp.y)<40){cash=Math.max(0,cash-200);document.getElementById('cash').innerText=cash;stars=Math.max(0,stars-1);document.getElementById('star').innerText='⭐'.repeat(Math.floor(stars))||'0';cp.x+=400;showMsg('Busted! -$200')}});camX+=(px-canvas.width/2-camX)*0.12;camY+=(py-canvas.height/2-camY)*0.12;}
function draw(){if(!started){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);return;}ctx.fillStyle=`hsl(${hue},30%,18%)`;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle=`hsla(${hue},60%,50%,0.15)`;for(let i=-1000;i<3000;i+=100){ctx.beginPath();ctx.moveTo(i-camX,0-camY);ctx.lineTo(i-camX,3000-camY);ctx.stroke();ctx.beginPath();ctx.moveTo(0-camX,i-camY);ctx.lineTo(3000-camX,i-camY);ctx.stroke();}buildings.forEach(b=>{ctx.fillStyle=`hsl(${280+Math.random()*10},70%,20%)`;ctx.fillRect(b.x-camX,b.y-camY,b.w,b.h);});coins.forEach(o=>{if(!o.taken){ctx.save();ctx.translate(o.x-camX,o.y-camY);ctx.rotate(Date.now()/500);ctx.fillStyle='#ff0';ctx.fillRect(-8,-8,16,16);ctx.restore();}});cars.forEach((c,i)=>{ctx.save();ctx.translate(c.x-camX,c.y-camY);ctx.rotate(c.a);ctx.fillStyle=c.c;ctx.fillRect(-26,-14,52,28);ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(-8,-14,12,28);ctx.restore();});ctx.fillStyle='#0ff';cops.forEach(cp=>{ctx.fillRect(cp.x-camX-12,cp.y-camY-8,24,16)});if(!inCar){ctx.save();ctx.translate(px-camX,py-camY);ctx.rotate(pa);ctx.fillStyle='#f33';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.restore();}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
