<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA555R</title><style>body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}.h{padding:15px;background:#1a1a1a;display:flex;justify-content:space-between;position:sticky;top:0}.logo{font-size:26px;font-weight:bold;color:#ff3333}.logo span{color:#168cff}.hero{text-align:center;padding:20px}.g{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:900px;margin:auto}.c{background:#1e1e1e;border-radius:15px;overflow:hidden;text-align:center;padding-bottom:12px;border:1px solid #333}.b{display:inline-block;margin-top:8px;background:#168cff;color:#fff;padding:8px 20px;border-radius:20px;font-weight:bold;text-decoration:none}.p{display:none;position:fixed;inset:0;background:#000;z-index:100}.cl{position:absolute;top:12px;right:15px;background:#fff;color:#000;padding:8px 14px;border-radius:20px;font-weight:bold;z-index:101}</style></head><body><div class="h"><div class="logo">GTA<span>555R</span></div><div style="font-size:12px;opacity:.7">Free Games</div></div><div class="hero"><h1>Play Free GTA Games</h1><p style="color:#aaa">No download - Play on mobile</p></div><div class="g"><div class="c"><div style="height:120px;background:linear-gradient(45deg,#168cff,#004080);display:flex;align-items:center;justify-content:center;font-size:55px">🚔</div><h3>Police Chase</h3><p style="font-size:11px;color:#aaa">High speed</p><a class="b" onclick="openGame()">PLAY NOW</a></div><div class="c"><div style="height:120px;background:linear-gradient(45deg,#8B4513,#CD853F);display:flex;align-items:center;justify-content:center;font-size:55px">🚙</div><h3>Thar Offroad</h3><p style="font-size:11px;color:#aaa">Coming Soon</p><a class="b" style="background:#555">SOON</a></div><div class="c"><div style="height:120px;background:linear-gradient(45deg,#ffcc00,#ff8800);display:flex;align-items:center;justify-content:center;font-size:55px">🛺</div><h3>Auto Rickshaw</h3><p style="font-size:11px;color:#aaa">Kerala</p><a class="b" style="background:#555">SOON</a></div><div class="c"><div style="height:120px;background:linear-gradient(45deg,#ff3333,#880000);display:flex;align-items:center;justify-content:center;font-size:55px">🏎️</div><h3>More Games</h3><p style="font-size:11px;color:#aaa">Adding soon</p><a class="b" style="background:#555">SOON</a></div></div><div id="playArea" class="p"><div class="cl" onclick="closeGame()">✕ CLOSE</div><div id="gameWrap" style="width:100%;height:100%"></div></div><script>const gameHTML=`<style>#game{position:relative;width:100%;max-width:430px;height:100vh;margin:auto;overflow:hidden;background:#2b2b2b}#road{position:absolute;inset:0;background:#3a3a3a}#road:before,#road:after{content:"";position:absolute;top:0;bottom:0;width:8px;background:#fff}#road:before{left:12%}#road:after{right:12%}.lane{position:absolute;width:6px;height:70px;background:#eee;left:50%;transform:translateX(-50%)}.car{position:absolute;width:56px;height:90px;border-radius:14px}.enemy{background:#e73535;display:flex;align-items:center;justify-content:center;font-size:28px}#player{background:#168cff;bottom:110px;left:calc(50% - 28px);z-index:2}#score{position:absolute;top:14px;left:14px;color:#fff;font-size:22px;font-weight:bold}#over{display:none;position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.78);color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center}.controls{position:absolute;z-index:8;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 25px}.ctrl{width:92px;height:66px;border-radius:18px;background:rgba(255,255,255,.28);color:#fff;border:2px solid rgba(255,255,255,.6);font-size:34px;display:flex;align-items:center;justify-content:center}.btnR{border:0;border-radius:14px;padding:14px 32px;font-size:20px;font-weight:bold;background:#fff;color:#222;margin-top:16px}</style><div id="game"><div id="road"></div><div id="score">Score: 0</div><div id="player" class="car"></div><div class="controls"><div id="left" class="ctrl">◀</div><div id="right" class="ctrl">▶</div></div><div id="over"><h1>GAME OVER</h1><p id="final">Score: 0</p><button id="restart" class="btnR">Restart</button></div></div>`;function openGame(){document.getElementById('playArea').style.display='block';document.getElementById('gameWrap').innerHTML=gameHTML;setTimeout(initGame,100);}function closeGame(){document.getElementById('playArea').style.display='none';document.getElementById('gameWrap').innerHTML='';}function initGame(){const game=document.getElementById("game");const player=document.getElementById("player");const scoreEl=document.getElementById("score");const overEl=document.getElementById("over");const finalEl=document.getElementById("final");const restart=document.getElementById("restart");if(!game)return;let playerX,enemies=[],lines=[],score=0,speed=270,running=true,leftPressed=false,rightPressed=false,lastTime=0,spawnTimer=0;function reset(){game.querySelectorAll(".enemy,.lane").forEach(e=>e.remove());enemies=[];lines=[];score=0;speed=270;running=true;spawnTimer=0;lastTime=performance.now();playerX=game.clientWidth/2-28;player.style.left=playerX+"px";scoreEl.textContent="Score: 0";overEl.style.display="none";for(let i=0;i<6;i++){const line=document.createElement("div");line.className="lane";line.style.top=(i*130-100)+"px";game.appendChild(line);lines.push({el:line,y:i*130-100})}requestAnimationFrame(loop);}function spawnEnemy(){const enemy=document.createElement("div");enemy.className="car enemy";enemy.textContent="🚗";const rl=game.clientWidth*.12+10;const rr=game.clientWidth*.88-66;const x=rl+Math.random()*Math.max(1,rr-rl);enemy.style.left=x+"px";enemy.style.top="-100px";game.appendChild(enemy);enemies.push({el:enemy,y:-100});}function hit(a,b){const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();return ar.left<br.right-10&&ar.right>br.left+10&&ar.top<br.bottom-10&&ar.bottom>br.top+10}function endGame(){running=false;finalEl.textContent="Score: "+Math.floor(score);overEl.style.display="flex"}function loop(t){if(!running)return;const dt=Math.min((t-lastTime)/1000,.04);lastTime=t;const mv=300*dt;if(leftPressed)playerX-=mv;if(rightPressed)playerX+=mv;const min=game.clientWidth*.12+10;const max=game.clientWidth*.88-player.offsetWidth-10;playerX=Math.max(min,Math.min(max,playerX));player.style.left=playerX+"px";lines.forEach(l=>{l.y+=speed*dt;if(l.y>game.clientHeight)l.y=-80;l.el.style.top=l.y+"px"});spawnTimer+=dt;if(spawnTimer>Math.max(.45,1-score/250)){spawnTimer=0;spawnEnemy()}enemies.forEach((e,i)=>{e.y+=speed*dt;e.el.style.top=e.y+"px";if(hit(player,e.el))endGame();if(e.y>game.clientHeight+100){e.el.remove();enemies.splice(i,1);score+=10;speed+=3}});score+=dt*2;scoreEl.textContent="Score: "+Math.floor(score);requestAnimationFrame(loop);}function hold(btn,dir){const on=e=>{e.preventDefault();if(dir=="left")leftPressed=true;else rightPressed=true};const off=e=>{e.preventDefault();if(dir=="left")leftPressed=false;else rightPressed=false};btn.addEventListener("pointerdown",on);btn.addEventListener("pointerup",off);btn.addEventListener("pointercancel",off);btn.addEventListener("pointerleave",off);}hold(document.getElementById("left"),"left");hold(document.getElementById("right"),"right");window.addEventListener("keydown",e=>{if(e.key=="ArrowLeft")leftPressed=true;if(e.key=="ArrowRight")rightPressed=true});window.addEventListener("keyup",e=>{if(e.key=="ArrowLeft")leftPressed=false;if(e.key=="ArrowRight")rightPressed=false});restart.addEventListener("click",reset);reset();}</script></body></html>
